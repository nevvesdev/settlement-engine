spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: settlement
  flyway:
    enabled: true
    schemas: settlement
    locations: classpath:db/migration
    create-schemas: true
    default-schema: settlement
  data:
    redis:
      host: localhost
      port: 6379
      password: redis123
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: settlement-engine-test
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

logging:
  level:
    br.com.nevvesdev: DEBUG
    org.flywaydb: INFO
