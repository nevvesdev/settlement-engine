spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/settlement_engine}
    username: ${DB_USER:settlement}
    password: ${DB_PASSWORD:settlement123}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis123}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: settlement-engine
      auto-offset-reset: earliest

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    br.com.nevvesdev: DEBUG
