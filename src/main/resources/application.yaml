spring:
    application:
        name: settlement-engine
    profiles:
        active: ${SPRING_PROFILES_ACTIVE:dev}
    jpa:
        open-in-view: false
        hibernate:
            ddl-auto: validate
        properties:
            hibernate:
                default_schema: settlement
    flyway:
        enabled: true

management:
    endpoints:
        web:
            exposure:
                include: health,info,prometheus,metrics
    endpoint:
        health:
            show-details: never
